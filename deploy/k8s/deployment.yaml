apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentweave-proxy
  namespace: agentweave
  labels:
    app: agentweave-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentweave-proxy
  template:
    metadata:
      labels:
        app: agentweave-proxy
    spec:
      # The image registry (localhost:5000) runs only on arnabsnas, so a pod
      # scheduled onto any other node ImagePullBackOffs. This pin existed only
      # in the live cluster until now — the manifest lacked it, so a reschedule
      # would have broken the deployment with no way to see why from git.
      nodeSelector:
        kubernetes.io/hostname: arnabsnas
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: proxy
          # Pinned so the running build is identifiable from the cluster alone.
          # scripts/deploy.sh cross-checks this against the SDK version and
          # refuses to deploy on mismatch. Bump both together.
          image: localhost:5000/agentweave-proxy:0.3.6
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: agentweave-proxy
          env:
            # Proxy token injected from Secret — never hardcode in ConfigMap
            - name: AGENTWEAVE_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentweave-proxy
                  key: proxy-token
            # Proxy-side API key injection (optional — allows callers to use ANTHROPIC_API_KEY=dummy)
            - name: AGENTWEAVE_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentweave-proxy
                  key: anthropic-api-key
                  optional: true
            - name: AGENTWEAVE_GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentweave-proxy
                  key: google-api-key
                  optional: true
            - name: AGENTWEAVE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentweave-proxy
                  key: openai-api-key
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 3
            periodSeconds: 10
