apiVersion: v1
kind: Service
metadata:
  name: agentweave-otel-collector
  namespace: monitoring
  labels:
    app: agentweave-otel-collector
spec:
  type: ClusterIP
  selector:
    app: agentweave-otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: otlp-grpc
      port: 4317
      targetPort: 4317

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentweave-otel-collector
  namespace: monitoring
  labels:
    app: agentweave-otel-collector
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      batch:
        timeout: 5s
        send_batch_size: 256
      memory_limiter:
        check_interval: 5s
        limit_mib: 384
        spike_limit_mib: 128

      # Claude Code's native OTel spans carry account PII by default —
      # user.email, user.id, user.account_uuid, user.account_id and
      # organization.id appear on claude_code.interaction with no content
      # flags enabled. Enabling native tracing is not optional for us: it is
      # the only way Claude Code emits the traceparent that lets proxy spans
      # join the interaction trace (#245). So the PII is stripped here, at the
      # ingest boundary, before anything reaches Tempo.
      attributes/strip_pii:
        actions:
          - key: user.email
            action: delete
          - key: user.id
            action: delete
          - key: user.account_uuid
            action: delete
          - key: user.account_id
            action: delete
          - key: organization.id
            action: delete

      # Defense in depth for OpenClaw native spans. Source capture is disabled
      # on the gateway, but a future config regression must not send model
      # input/output or tool content to Tempo. Other services are unaffected.
      attributes/strip_openclaw_content:
        include:
          match_type: strict
          services: [openclaw]
        actions:
          - pattern: '^openclaw\.content\..*'
            action: delete
          - key: gen_ai.input.messages
            action: delete
          - key: gen_ai.output.messages
            action: delete
          - key: gen_ai.tool.definitions
            action: delete
          - key: gen_ai.tool.call.arguments
            action: delete
          - key: gen_ai.tool.call.result
            action: delete
          - key: input.value
            action: delete
          - key: output.value
            action: delete

      transform/openclaw_native:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(span.attributes["prov.harness"], "openclaw") where resource.attributes["service.name"] == "openclaw" and span.name == "openclaw.model.call" and span.attributes["prov.harness"] == nil
              - set(span.attributes["prov.source"], "native") where resource.attributes["service.name"] == "openclaw" and span.name == "openclaw.model.call" and span.attributes["prov.source"] == nil
              - set(span.attributes["prov.llm.provider"], span.attributes["openclaw.provider"]) where resource.attributes["service.name"] == "openclaw" and span.name == "openclaw.model.call" and span.attributes["openclaw.provider"] != nil and span.attributes["prov.llm.provider"] == nil
              - set(span.attributes["prov.llm.model"], span.attributes["gen_ai.request.model"]) where resource.attributes["service.name"] == "openclaw" and span.name == "openclaw.model.call" and span.attributes["gen_ai.request.model"] != nil and span.attributes["prov.llm.model"] == nil
              - set(span.attributes["prov.llm.model"], span.attributes["openclaw.model"]) where resource.attributes["service.name"] == "openclaw" and span.name == "openclaw.model.call" and span.attributes["gen_ai.request.model"] == nil and span.attributes["openclaw.model"] != nil and span.attributes["prov.llm.model"] == nil
              - set(span.attributes["prov.llm.prompt_tokens"], span.attributes["gen_ai.usage.input_tokens"]) where resource.attributes["service.name"] == "openclaw" and span.name == "openclaw.model.call" and span.attributes["gen_ai.usage.input_tokens"] != nil and span.attributes["prov.llm.prompt_tokens"] == nil
              - set(span.attributes["prov.llm.completion_tokens"], span.attributes["gen_ai.usage.output_tokens"]) where resource.attributes["service.name"] == "openclaw" and span.name == "openclaw.model.call" and span.attributes["gen_ai.usage.output_tokens"] != nil and span.attributes["prov.llm.completion_tokens"] == nil
              - set(span.attributes["tokens.cache_read"], span.attributes["gen_ai.usage.cache_read.input_tokens"]) where resource.attributes["service.name"] == "openclaw" and span.name == "openclaw.model.call" and span.attributes["gen_ai.usage.cache_read.input_tokens"] != nil and span.attributes["tokens.cache_read"] == nil
              - set(span.attributes["tokens.cache_write"], span.attributes["gen_ai.usage.cache_creation.input_tokens"]) where resource.attributes["service.name"] == "openclaw" and span.name == "openclaw.model.call" and span.attributes["gen_ai.usage.cache_creation.input_tokens"] != nil and span.attributes["tokens.cache_write"] == nil

    exporters:
      otlphttp/tempo:
        endpoint: http://tempo.monitoring.svc.cluster.local:4318

      debug:
        verbosity: basic

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/strip_pii, attributes/strip_openclaw_content, transform/openclaw_native, batch]
          exporters: [otlphttp/tempo, debug]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentweave-otel-collector
  namespace: monitoring
  labels:
    app: agentweave-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentweave-otel-collector
  template:
    metadata:
      labels:
        app: agentweave-otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.126.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/collector.yaml
          env:
            - name: LANGFUSE_OTLP_AUTH_HEADER
              valueFrom:
                secretKeyRef:
                  name: agentweave-otel-collector
                  key: LANGFUSE_OTLP_AUTH_HEADER
                  optional: true
          ports:
            - containerPort: 4318
              name: otlp-http
            - containerPort: 4317
              name: otlp-grpc
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /conf
      volumes:
        - name: config
          configMap:
            name: agentweave-otel-collector
